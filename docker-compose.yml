version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: centrewatch_backend
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite:////app/training_centre.db
    volumes:
      - evidence_data:/app/evidence_storage
      - datasets_data:/app/datasets
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: centrewatch_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  evidence_data:
  datasets_data:
